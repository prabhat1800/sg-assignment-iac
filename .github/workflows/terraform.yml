name: Terraform Infrastructure

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_changes: ${{ steps.matrix.outputs.has_changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed environments
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            dev:
              - 'infra/envs/dev/**'
            staging:
              - 'infra/envs/staging/**'
            prod:
              - 'infra/envs/prod/**'

      - name: Build environment matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_ENVIRONMENT: ${{ inputs.environment }}
          DEV_CHANGED: ${{ steps.filter.outputs.dev }}
          STAGING_CHANGED: ${{ steps.filter.outputs.staging }}
          PROD_CHANGED: ${{ steps.filter.outputs.prod }}
        run: |
          selected_environments=()

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            selected_environments+=("$MANUAL_ENVIRONMENT")
          else
            [[ "$DEV_CHANGED" == "true" ]] && selected_environments+=("dev")
            [[ "$STAGING_CHANGED" == "true" ]] && selected_environments+=("staging")
            [[ "$PROD_CHANGED" == "true" ]] && selected_environments+=("prod")
          fi

          matrix='{"environment":['
          for environment in "${selected_environments[@]}"; do
            [[ "$matrix" != '{"environment":[' ]] && matrix+=','
            matrix+="\"$environment\""
          done
          matrix+=']}'
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "has_changes=$([[ ${#selected_environments[@]} -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  fmt-validate:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  plan:
    runs-on: ubuntu-latest
    needs: [changes, fmt-validate]
    if: github.event_name != 'push' && needs.changes.outputs.has_changes == 'true'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    environment: ${{ matrix.environment }}

    defaults:
      run:
        working-directory: infra/envs/${{ matrix.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_TERRAFORM_SA }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -out=tfplan -input=false

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}-${{ github.event.pull_request.number || github.run_id }}
          path: infra/envs/${{ matrix.environment }}/tfplan
          retention-days: 14

  apply-merge:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.has_changes == 'true'
    permissions:
      contents: read
      id-token: write
      pull-requests: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find merged pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number')
          if [[ -z "$pr_number" || "$pr_number" == "null" ]]; then
            echo "Could not resolve the merged pull request for commit ${{ github.sha }}" >&2
            exit 1
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Download plan from pull request
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: terraform.yml
          pr: ${{ steps.pr.outputs.number }}
          name: tfplan-${{ matrix.environment }}-${{ steps.pr.outputs.number }}
          path: infra/envs/${{ matrix.environment }}
          workflow_conclusion: success

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_TERRAFORM_SA }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: terraform apply -input=false tfplan